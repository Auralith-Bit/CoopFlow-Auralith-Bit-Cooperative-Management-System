<div class="page-container">
  <div class="page-header">
    <h1>New Transaction</h1>
    <a routerLink="/transactions" class="btn-outline">Back to Transactions</a>
  </div>

  <div class="form-card">
    <form (ngSubmit)="onSubmit()" #txnForm="ngForm">
      <div class="form-group">
        <label for="memberId">Member *</label>
        <select id="memberId" name="memberId" [(ngModel)]="data.memberId" required>
          <option [ngValue]="0">-- Select a member --</option>
          <option *ngFor="let m of members" [ngValue]="m.id">{{ m.firstName }} {{ m.lastName }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="type">Transaction Type *</label>
        <select id="type" name="type" [(ngModel)]="data.type" required>
          <option value="CREDIT">Credit</option>
          <option value="DEBIT">Debit</option>
          <option value="DEPOSIT">Deposit</option>
          <option value="WITHDRAWAL">Withdrawal</option>
        </select>
      </div>

      <div class="form-group">
        <label for="amount">Amount *</label>
        <input id="amount" name="amount" type="number" [(ngModel)]="data.amount" required min="1" placeholder="Enter amount" />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" [(ngModel)]="data.description" placeholder="Optional description" rows="3"></textarea>
      </div>

      <div class="form-error" *ngIf="error">{{ error }}</div>
      <div class="form-success" *ngIf="success">{{ success }}</div>

      <div class="form-actions">
        <a routerLink="/transactions" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? 'Creating...' : 'Create Transaction' }}
        </button>
      </div>
    </form>
  </div>
</div>
