<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-role-badge member">Member</div>
      <h2>Member Login</h2>
      <p>Sign in to access your account</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" [(ngModel)]="data.username" required placeholder="Enter your username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="data.password" required placeholder="Enter your password" />
      </div>
      <div class="form-error" *ngIf="error">{{ error }}</div>
      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
    <div class="auth-footer">
      Don't have an account? <a routerLink="/register">Register here</a>
    </div>
  </div>
</div>
