<div class="page-container">
  <div class="page-header">
    <h1>Create Staff User</h1>
    <a routerLink="/admin/users" class="btn-outline">Back to Users</a>
  </div>

  <div class="form-card">
    <form (ngSubmit)="onSubmit()" #userForm="ngForm">
      <div class="form-group">
        <label for="username">Username *</label>
        <input id="username" name="username" type="text" [(ngModel)]="data.username" required minlength="3" placeholder="Choose a username" />
      </div>
      <div class="form-group">
        <label for="email">Email *</label>
        <input id="email" name="email" type="email" [(ngModel)]="data.email" required placeholder="Email address" />
      </div>
      <div class="form-group">
        <label for="password">Password *</label>
        <input id="password" name="password" type="password" [(ngModel)]="data.password" required minlength="6" placeholder="Password" />
      </div>
      <div class="form-group">
        <label for="role">Role *</label>
        <select id="role" name="role" [(ngModel)]="data.role" required>
          <option value="ACCOUNTANT">Accountant</option>
          <option value="MANAGER">Manager</option>
        </select>
      </div>
      <div class="form-error" *ngIf="error">{{ error }}</div>
      <div class="form-success" *ngIf="success">{{ success }}</div>
      <div class="form-actions">
        <a routerLink="/admin/users" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? 'Creating...' : 'Create User' }}
        </button>
      </div>
    </form>
  </div>
</div>
