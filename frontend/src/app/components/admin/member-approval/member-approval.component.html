<div class="page-container">
  <div class="page-header">
    <h1>Member Registration Requests</h1>
  </div>

  <div class="loading" *ngIf="loading">Loading pending registrations...</div>
  <div class="error" *ngIf="error">{{ error }}</div>

  <div class="table-card" *ngIf="!loading">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Registered</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of pendingMembers">
          <td>{{ m.memberId }}</td>
          <td>{{ m.firstName }} {{ m.lastName }}</td>
          <td>{{ m.email }}</td>
          <td>{{ m.phone || '-' }}</td>
          <td>{{ m.joinDate | date:'mediumDate' }}</td>
          <td class="actions">
            <button class="btn-sm btn-approve" (click)="approve(m.id)">Approve</button>
            <button class="btn-sm btn-reject" (click)="reject(m.id)">Reject</button>
          </td>
        </tr>
        <tr *ngIf="pendingMembers.length === 0">
          <td colspan="6" class="empty-msg">No pending registration requests.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
