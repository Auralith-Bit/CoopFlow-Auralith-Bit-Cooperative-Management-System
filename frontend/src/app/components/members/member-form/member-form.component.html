<div class="page-container">
  <div class="page-header">
    <h1>{{ isEdit ? 'Edit Member' : 'Add Member' }}</h1>
    <a routerLink="/members" class="btn-outline">Back to List</a>
  </div>

  <div class="form-card">
    <form (ngSubmit)="onSubmit()" #memberForm="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input id="firstName" name="firstName" type="text" [(ngModel)]="member.firstName" required placeholder="First name" />
        </div>
        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input id="lastName" name="lastName" type="text" [(ngModel)]="member.lastName" required placeholder="Last name" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="email">Email *</label>
          <input id="email" name="email" type="email" [(ngModel)]="member.email" required placeholder="Enter email" />
        </div>
        <div class="form-group">
          <label for="phone">Phone *</label>
          <input id="phone" name="phone" type="text" [(ngModel)]="member.phone" required placeholder="Enter phone number" />
        </div>
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address" [(ngModel)]="member.address" placeholder="Enter address" rows="2"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="city">City</label>
          <input id="city" name="city" type="text" [(ngModel)]="member.city" placeholder="City" />
        </div>
        <div class="form-group">
          <label for="state">State</label>
          <input id="state" name="state" type="text" [(ngModel)]="member.state" placeholder="State" />
        </div>
        <div class="form-group">
          <label for="zipCode">ZIP Code</label>
          <input id="zipCode" name="zipCode" type="text" [(ngModel)]="member.zipCode" placeholder="ZIP Code" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status" [(ngModel)]="member.status">
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
          </select>
        </div>
      </div>
      <div class="form-error" *ngIf="error">{{ error }}</div>
      <div class="form-actions">
        <a routerLink="/members" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? 'Saving...' : (isEdit ? 'Update Member' : 'Create Member') }}
        </button>
      </div>
    </form>
  </div>
</div>
