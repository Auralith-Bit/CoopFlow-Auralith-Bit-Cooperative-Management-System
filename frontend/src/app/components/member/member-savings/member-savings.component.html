<div class="savings-container" *ngIf="!loading">
  <div class="balance-card">
    <div class="balance-label">Current Balance</div>
    <div class="balance-value">₹{{ balance | number:'1.2-2' }}</div>
  </div>

  <div class="forms-grid">
    <div class="card">
      <div class="card-header">
        <h2>Deposit</h2>
      </div>
      <div class="card-body">
        <div class="alert success" *ngIf="depositSuccess">{{ depositSuccess }}</div>
        <div class="alert error" *ngIf="depositError">{{ depositError }}</div>

        <form (ngSubmit)="onDeposit()" #depositForm="ngForm">
          <div class="form-group">
            <label for="depositAmount">Amount (₹)</label>
            <input type="number" id="depositAmount" name="amount" [(ngModel)]="depositData.amount"
                   required min="1" placeholder="Enter amount" class="form-control" />
          </div>
          <div class="form-group">
            <label for="depositDesc">Description</label>
            <input type="text" id="depositDesc" name="description" [(ngModel)]="depositData.description"
                   placeholder="Optional description" class="form-control" />
          </div>
          <button type="submit" class="action-btn deposit-btn"
                  [disabled]="submittingDeposit || !depositForm.form.valid">
            {{ submittingDeposit ? 'Processing...' : 'Deposit' }}
          </button>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Withdraw</h2>
      </div>
      <div class="card-body">
        <div class="alert success" *ngIf="withdrawSuccess">{{ withdrawSuccess }}</div>
        <div class="alert error" *ngIf="withdrawError">{{ withdrawError }}</div>

        <form (ngSubmit)="onWithdraw()" #withdrawForm="ngForm">
          <div class="form-group">
            <label for="withdrawAmount">Amount (₹)</label>
            <input type="number" id="withdrawAmount" name="amount" [(ngModel)]="withdrawData.amount"
                   required min="1" placeholder="Enter amount" class="form-control" />
          </div>
          <div class="form-group">
            <label for="withdrawDesc">Description</label>
            <input type="text" id="withdrawDesc" name="description" [(ngModel)]="withdrawData.description"
                   placeholder="Optional description" class="form-control" />
          </div>
          <button type="submit" class="action-btn withdraw-btn"
                  [disabled]="submittingWithdraw || !withdrawForm.form.valid">
            {{ submittingWithdraw ? 'Processing...' : 'Withdraw' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="loading" *ngIf="loading">Loading savings...</div>
<div class="error" *ngIf="error">{{ error }}</div>
